[package]
name = "roofic"
version = "0.1.0"
description = "Roofic capstone — tokenized rental property: KYC-gated share tokens, USDC payments, pro-rata rent, platform fees and pause"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "roofic"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = "1.2.2"

[dev-dependencies]
litesvm = "0.18.1"
solana-message = "4"
solana-transaction = "4"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "4.3.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

