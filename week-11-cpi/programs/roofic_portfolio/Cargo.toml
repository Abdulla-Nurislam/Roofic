[package]
name = "roofic_portfolio"
version = "0.1.0"
description = "Roofic portfolio — composes roofic_shares via CPI and tracks an investor's purchases (Week 11)"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "roofic_portfolio"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "roofic_shares/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = "1.2.2"
roofic_shares = { path = "../roofic_shares", features = ["cpi"] }

[dev-dependencies]
litesvm = "0.18.1"
solana-message = "4"
solana-transaction = "4"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

